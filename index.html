<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outbreak</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #06070a; color: #aeb6bf; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      #view:active { cursor: grabbing; }
      #controls { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; background: rgba(6, 7, 10, 0.75); padding: 6px 8px; border-radius: 4px; }
      #controls button { background: none; color: #7c858f; border: 1px solid #2a2f36; border-radius: 3px; padding: 2px 7px; font: inherit; cursor: pointer; }
      #controls button.on, #controls button:hover { color: #e6ecf2; border-color: #5a636d; }
      #controls .status { margin-left: 10px; white-space: nowrap; }
      #ticker { position: fixed; top: 12px; right: 12px; width: min(460px, 45vw); display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
      #ticker .line { pointer-events: auto; text-align: left; background: rgba(6, 7, 10, 0.72); color: #d6dde4; border: 0; border-radius: 3px; padding: 3px 7px; font: inherit; cursor: pointer; transition: opacity 0.6s; }
      #ticker .line:hover { color: #fff; }
      #ticker .where { color: #6c757f; }
      #roster { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 1px; background: rgba(6, 7, 10, 0.72); padding: 6px 4px; border-radius: 4px; max-height: 70vh; overflow-y: auto; }
      #roster:empty { display: none; }
      #roster .title { color: #6c757f; padding: 0 6px 4px; }
      #roster button { background: none; border: 0; color: #c9d1d9; text-align: left; font: inherit; padding: 1px 6px; cursor: pointer; border-radius: 3px; }
      #roster button:hover, #roster button.on { background: #1a1f26; color: #fff; }
      #roster { overflow: visible; }
      #roster .lost { position: relative; color: #5b636c; padding: 4px 6px 0; cursor: default; }
      #roster .lost-names { display: none; position: absolute; left: 100%; top: 0; margin-left: 6px; background: rgba(6, 7, 10, 0.92); padding: 6px 8px; border-radius: 4px; color: #6c757f; text-decoration: line-through; white-space: nowrap; max-height: 60vh; overflow-y: auto; }
      #roster .lost:hover .lost-names { display: block; }
      #inspector { position: fixed; right: 12px; bottom: 12px; width: 300px; background: rgba(6, 7, 10, 0.82); padding: 8px 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 3px; }
      #inspector:empty { display: none; }
      #inspector .head { color: #eef3f7; }
      #inspector .sub { color: #9aa3ad; }
      #inspector .dim { color: #6c757f; }
      #inspector .warn { color: #e0727a; }
      #inspector .story { color: #c9d1d9; font-style: italic; margin-top: 3px; }
      #inspector .bar { display: flex; align-items: center; gap: 6px; color: #6c757f; }
      #inspector .bar .label { width: 64px; }
      #inspector .bar .track { flex: 1; height: 4px; background: #1a1f26; border-radius: 2px; overflow: hidden; }
      #inspector .bar .fill { display: block; height: 100%; background: #8b949e; }
      #inspector .squares { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0; }
      #inspector .sq { width: 7px; height: 7px; font-size: 7px; line-height: 7px; text-align: center; color: #06070a; }
      #inspector .sq.resident { background: #5d646c; }
      #inspector .sq.tracked { background: #eef3f7; }
      #inspector .sq.occupier { background: #c03a43; }
      #inspector .sq.click { cursor: pointer; }
      #inspector .history { color: #7c858f; border-top: 1px solid #1a1f26; margin-top: 4px; padding-top: 4px; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="controls"></div>
    <div id="ticker"></div>
    <div id="roster"></div>
    <div id="inspector"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
