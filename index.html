<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outbreak</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06070a; color: #aeb6bf; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      #view:active { cursor: grabbing; }
      #controls { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; background: rgba(6, 7, 10, 0.75); padding: 6px 8px; border-radius: 4px; }
      #controls button { background: none; color: #7c858f; border: 1px solid #2a2f36; border-radius: 3px; padding: 2px 7px; font: inherit; cursor: pointer; }
      #controls button.on, #controls button:hover { color: #e6ecf2; border-color: #5a636d; }
      #controls .status { margin-left: 10px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="controls"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
